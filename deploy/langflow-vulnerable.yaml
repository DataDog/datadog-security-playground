apiVersion: apps/v1
kind: Deployment
metadata:
  name: langflow-vulnerable
  namespace: playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langflow-vulnerable
  template:
    metadata:
      labels:
        app: langflow-vulnerable
        admission.datadoghq.com/cws-instrumentation.enabled: "true"
        # Opt this pod out of Datadog Single-Step Instrumentation: SSI's
        # admission controller injects ddtrace via PYTHONPATH. That takes
        # priority over and can override the ddtrace==4.14.0 release pinned
        # inside this image. CWS instrumentation above is unaffected --
        # that's a separate injection path.
        admission.datadoghq.com/enabled: "false"
    spec:
      containers:
        - name: langflow-vulnerable
          # Built from langflow-vulnerable/Dockerfile: the real, upstream
          # Langflow image pinned by digest to the last version affected by
          # CVE-2025-3248 (unauthenticated exec() on user-supplied code via
          # POST /api/v1/validate/code, fixed in 1.3.0), with released
          # ddtrace==4.14.0 installed into the upstream venv.
          image: ghcr.io/datadog/datadog-security-playground:langflow-vulnerable-ddtrace-4.14.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 7860
          env:
            - name: DD_SERVICE
              value: "langflow-vulnerable"
            - name: DD_APPSEC_ENABLED
              value: "true"
            - name: DD_IAST_ENABLED
              value: "true"
            - name: DD_APPSEC_SCA_ENABLED
              value: "true"
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_TRACE_AGENT_PORT
              value: "8126"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1"
