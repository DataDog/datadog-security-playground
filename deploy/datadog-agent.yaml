datadog:
  site: "datadoghq.com"
  apiKeyExistingSecret: "datadog-api-secret"
  
  apm:
    portEnabled: true
    port: 8126
    socketEnabled: true
    instrumentation:
      enabled: true
      targets:
        - name: "default-target"
          namespaceSelector:
            matchNames:
              - playground
          podSelector:
            matchLabels:
              app: playground-app
          ddTraceVersions:
            java: "1"
            python: "4"
            js: "5"
            php: "1"
            dotnet: "3"
            ruby: "2"

  sbom:
    containerImage:
      enabled: true

  env:
    - name: DD_ENV
      value: "playground-env"
    - name: DD_CLUSTER_NAME
      value: "playground-cluster"
    - name: DD_KUBELET_TLS_VERIFY
      value: "false"
    - name: DD_SBOM_CONTAINER_IMAGE_ALLOW_MISSING_REPODIGEST
      value: "true"
    - name: DD_REMOTE_CONFIGURATION_REFRESH_INTERVAL
      value: "5s"
  securityAgent:
    runtime:
      enabled: true
  asm:
    threats:
      enabled: true
    sca:
      enabled: true
    iast:
      enabled: true

clusterAgent:
  enabled: true
  admissionController:
    mutateUnlabelled: true
    cwsInstrumentation:
      enabled: true
      mode: remote_copy
