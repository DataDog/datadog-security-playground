datadog:
  site: "datadoghq.com"
  apiKeyExistingSecret: "datadog-api-secret"

  apm:
    portEnabled: true
    port: 8126
    socketEnabled: true
    instrumentation:
      enabled: true
      targets:
        - name: "default-target"
          namespaceSelector:
            matchNames:
              - playground
          podSelector:
            matchLabels:
              app: playground-app
          ddTraceVersions:
            java: "1"
            python: "4"
            js: "5"
            php: "1"
            dotnet: "3"
            ruby: "2"

  sbom:
    containerImage:
      enabled: true

  env:
    # TODO: personal value, left in place because it's what was verified
    # working — revert to a shared value (e.g. "playground-env") once this
    # is running the merged, upstream datadog-agent build.
    - name: DD_ENV
      value: "florentin.labelle"
    - name: DD_CLUSTER_NAME
      value: "playground-cluster"
    - name: DD_KUBELET_TLS_VERIFY
      value: "false"
    - name: DD_SBOM_CONTAINER_IMAGE_ALLOW_MISSING_REPODIGEST
      value: "true"
    - name: DD_REMOTE_CONFIGURATION_REFRESH_INTERVAL
      value: "5s"
    - name: DD_RUNTIME_SECURITY_CONFIG_HASH_RESOLVER_REPLACE
      value: >-
        {
          "/app/malware.x64": "sha256:f3f7eb972a998047edb4c6e4287308236fcd8a9ef81dc13e6469590275af3cac",
          "/app/malware.arm64": "sha256:80bab7f4bc97e36724433f9ab2dffea7fc0bf0d0fd31a7b6a4012a4f0821737e"
        }
    # TODO: temporary, for debugging missing trace_id correlation on CWS
    # events — revert once diagnosed.
    - name: DD_SYSTEM_PROBE_CONFIG_LOG_LEVEL
      value: "debug"
    # otel_tls (and span_tls/go_labels_procs/otel_span_attrs) are all sized
    # off this one flag (see SpanTrackMaxCount in probe_ebpf.go on
    # glopes/implement-otel-4947) — without it those BPF maps default to a
    # 1-entry LRU cache, causing unreliable/evicted CWS-APM trace_id
    # correlation under any concurrent tracer activity on the node.
    - name: DD_EVENT_MONITORING_CONFIG_SPAN_TRACKING_ENABLED
      value: "true"
  securityAgent:
    runtime:
      enabled: true
  asm:
    threats:
      enabled: true
    sca:
      enabled: true
    iast:
      enabled: true

# CI-built agent image for DataDog/datadog-agent#48446 (OTel thread-context /
# CWS-APM correlation, not yet merged) — pulled straight from the PR's own
# GitLab pipeline output on Docker Hub (public, multi-arch), so no
# sandbox-account image push is needed.
# TODO: drop this `agents.image` override (falling back to the chart's
# default public agent image) once #48446 merges and ships in a release.
agents:
  image:
    repository: datadog/agent-dev
    tag: "will-implement-otel-4947-py3"
    pullPolicy: Always
    # The tag above is the PR's branch name, not a semver, which breaks the
    # chart's get-agent-version-based feature gating (e.g. cnm-use-direct-send)
    # if left to the default semver check.
    doNotCheckTag: true

clusterAgent:
  enabled: true
  admissionController:
    mutateUnlabelled: true
    cwsInstrumentation:
      enabled: true
      mode: remote_copy
