datadog:
  site: "datadoghq.com"
  apiKeyExistingSecret: "datadog-api-secret"

  apm:
    portEnabled: true
    port: 8126
    socketEnabled: true
    instrumentation:
      enabled: true
      targets:
        - name: "default-target"
          namespaceSelector:
            matchNames:
              - playground
          podSelector:
            matchLabels:
              app: playground-app
          ddTraceVersions:
            java: "1"
            python: "4"
            js: "5"
            php: "1"
            dotnet: "3"
            ruby: "2"

  sbom:
    containerImage:
      enabled: true

  env:
    # TODO: personal value, left in place because it's what was verified
    # working — revert to a shared value (e.g. "playground-env") once this
    # is running the merged, upstream datadog-agent build.
    - name: DD_ENV
      value: "florentin.labelle"
    - name: DD_CLUSTER_NAME
      value: "playground-cluster"
    - name: DD_KUBELET_TLS_VERIFY
      value: "false"
    - name: DD_SBOM_CONTAINER_IMAGE_ALLOW_MISSING_REPODIGEST
      value: "true"
    - name: DD_REMOTE_CONFIGURATION_REFRESH_INTERVAL
      value: "5s"
    - name: DD_RUNTIME_SECURITY_CONFIG_HASH_RESOLVER_REPLACE
      value: >-
        {
          "/app/malware.x64": "sha256:f3f7eb972a998047edb4c6e4287308236fcd8a9ef81dc13e6469590275af3cac",
          "/app/malware.arm64": "sha256:80bab7f4bc97e36724433f9ab2dffea7fc0bf0d0fd31a7b6a4012a4f0821737e"
        }
  securityAgent:
    runtime:
      enabled: true
  asm:
    threats:
      enabled: true
    sca:
      enabled: true
    iast:
      enabled: true

# Custom agent build for DataDog/datadog-agent#48446 (OTel thread-context /
# CWS-APM correlation, not yet merged), built from that PR's branch and
# re-hosted in a personal ECR repo for testing (original sandbox-account
# repo wasn't pullable outside that account).
# TODO: drop this `agents.image` override (falling back to the chart's
# default public agent image) once #48446 merges and ships in a release.
agents:
  image:
    repository: 042128958095.dkr.ecr.us-east-1.amazonaws.com/datadog-agent-otel-4947
    # Chart parses this tag as a semver to decide which agent-version-gated
    # template branches to render (see get-agent-version in _helpers.tpl), so
    # it must stay a valid version string. 7.80.4 matches the actual
    # org.opencontainers.image.version baked into this custom build.
    tag: "7.80.4-otel4947"
    pullPolicy: Always

clusterAgent:
  enabled: true
  admissionController:
    mutateUnlabelled: true
    cwsInstrumentation:
      enabled: true
      mode: remote_copy
