name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-image:
    name: Build playground app image (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ./app/Dockerfile
          platforms: ${{ matrix.platform }}
          load: ${{ matrix.platform == 'linux/amd64' }}
          push: false
          tags: playground-app
          build-args: | # Pass GIT_SHA to allow for reproducible scenarios when downloading payloads from Github
            GIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}

      - name: Save image to tarball
        if: matrix.platform == 'linux/amd64'
        run: docker save playground-app | gzip > playground-app.tar.gz

      - name: Upload image artifact
        if: matrix.platform == 'linux/amd64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playground-app-image
          path: playground-app.tar.gz
          retention-days: 1
          if-no-files-found: error

  runtime-security-tests:
    name: Runtime Security Tests
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: playground-app-image
          path: .

      - name: Load image
        run: docker load -i playground-app.tar.gz

      - name: Start DD Agent container
        run: |
          docker run -d \
            --name dd-agent \
            --cgroupns=host \
            --pid=host \
            --net=host \
            --security-opt=apparmor:unconfined \
            --cap-add=SYS_ADMIN \
            --cap-add=SYS_RESOURCE \
            --cap-add=SYS_PTRACE \
            --cap-add=NET_ADMIN \
            --cap-add=NET_BROADCAST \
            --cap-add=NET_RAW \
            --cap-add=IPC_LOCK \
            --cap-add=CHOWN \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v /etc/os-release:/host/etc/os-release:ro \
            -v /etc/passwd:/etc/passwd:ro \
            -v /etc/group:/etc/group:ro \
            -v /sys/fs/cgroup/:/host/sys/fs/cgroup:ro \
            -v /proc/:/host/proc/:ro \
            -v /:/host/root:ro \
            -v /sys/kernel/debug:/sys/kernel/debug \
            -v $(pwd)/tests/agent_config/system-probe.yaml:/etc/datadog-agent/system-probe.yaml:ro \
            -e DD_RUNTIME_SECURITY_CONFIG_ENABLED=true \
            -e DD_API_KEY=dummy \
            -e HOST_PROC=/host/proc \
            -e HOST_ROOT=/host/root \
            datadog/agent:latest

      - name: Start playground app container
        run: |
          docker run -d \
            --name playground-app \
            --net=host \
            playground-app

      - name: Wait for playground readiness
        run: |
          echo "Waiting for playground app..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/ping > /dev/null 2>&1; then
              echo "Playground app is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Playground app did not become ready"
          exit 1

      - name: Run tests
        working-directory: tests
        run: python -m pytest test_rce_malware.py -v -s

      - name: Collect logs
        if: ${{ failure() }}
        run: |
          echo "=== DD Agent logs ==="
          docker logs dd-agent 2>&1 | tail -1000
          echo ""
          echo "=== Playground app logs ==="
          docker logs playground-app 2>&1 | tail -1000

      - name: Cleanup containers
        if: ${{ always() }}
        run: |
          docker rm -f dd-agent playground-app 2>/dev/null || true
